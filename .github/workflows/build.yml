name: Build YuB-X

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore YuB-X-Public.sln

      - name: Build solution (Release x64)
        run: msbuild YuB-X-Public.sln /p:Configuration=Release /p:Platform=x64

      - name: Locate build outputs
        shell: pwsh
        run: |
          Write-Host "=== DLL outputs ==="
          Get-ChildItem -Recurse -Filter *.dll | Where-Object { $_.FullName -match 'Release' -and $_.FullName -notmatch 'packages' } | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== EXE outputs ==="
          Get-ChildItem -Recurse -Filter *.exe | Where-Object { $_.FullName -match 'Release' -and $_.FullName -notmatch 'packages' } | ForEach-Object { Write-Host $_.FullName }

      - name: Upload YuB-X-Module DLL
        uses: actions/upload-artifact@v4
        with:
          name: YuB-X-Module
          path: '**/Release/**/*.dll'
          if-no-files-found: warn

      - name: Upload YuB-X-Interface EXE
        uses: actions/upload-artifact@v4
        with:
          name: YuB-X-Interface
          path: '**/Release/**/*.exe'
          if-no-files-found: warn
